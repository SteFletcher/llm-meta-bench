<title>Fable 5 → Fable 5.1 — What Changed Between Generations</title>
<style>
  :root {
    /* Solar Bench family palette — see solar-benchmark.html / solar-field.html */
    --page: #05070d; --surface: #0b1019; --panel-2: #101725;
    --ink: #eef4ff; --ink-2: #a7b3c8; --muted: #78859e;
    --hairline: #202a3b; --baseline: #2f3a4d; --ring: rgba(255,255,255,0.08);
    --accent: #6bb6ff;
    --a: #6bb6ff;   /* Fable 5 */
    --b: #67e8d1;   /* Fable 5.1 */
    --na: #4a5468;
    --win: #46d08a; --down: #ef6a5a;
    /* 1ch ~= 1.26 rendered chars in this stack: 58ch ~= 72 cpl, 62ch ~= 78 cpl */
    --measure: 58ch; --measure-wide: 62ch;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--page); color: var(--ink);
    font: 400 clamp(14px, 0.4vw + 12px, 16px)/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .mono { font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  a { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 clamp(16px,4vw,40px) 64px; }

  .hero { padding: clamp(32px,6vh,60px) 0 clamp(20px,3vh,30px); border-bottom: 1px solid var(--hairline); }
  .eyebrow { font-family: ui-monospace,"SF Mono",Menlo,monospace; font-size: 0.74rem;
    text-transform: uppercase; letter-spacing: 0.15em; color: var(--accent); margin: 0 0 12px; }
  .hero h1 { margin: 0 0 10px; font-size: clamp(26px,3.6vw,44px); font-weight: 780;
    letter-spacing: -0.028em; line-height: 1.08; text-wrap: balance; }
  .hero .dek { max-width: var(--measure-wide); color: var(--ink-2); font-size: 1.04em; margin: 0; }

  /* contender cards */
  .contenders { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch;
    gap: clamp(12px,2vw,24px); margin-top: clamp(20px,3vh,30px); }
  .card { border: 1px solid var(--hairline); border-top: 3px solid var(--c); border-radius: 8px;
    padding: 14px 16px; background: var(--surface); }
  .card.a { --c: var(--a); }
  .card.b { --c: var(--b); }
  .card .who { font-size: 1.15em; font-weight: 730; letter-spacing: -0.01em; }
  .card .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 7px; background: var(--c); }
  .card .sub { color: var(--ink-2); font-size: 0.85em; margin-top: 5px; }
  .vs { align-self: center; font-family: ui-monospace,"SF Mono",Menlo,monospace; color: var(--muted);
    font-weight: 700; font-size: 0.95em; }

  section { padding: clamp(24px,4vh,40px) 0; border-bottom: 1px solid var(--hairline); }
  .section-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  .section-head .p { font-family: ui-monospace,"SF Mono",Menlo,monospace; font-size: 0.7rem;
    text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent); }
  h2 { margin: 0; font-size: clamp(18px,2.1vw,24px); font-weight: 740; letter-spacing: -0.02em; }
  .p-note { color: var(--muted); font-size: 0.85em; margin: 4px 0 14px; max-width: var(--measure); }

  /* comparison rows */
  .cmp { display: flex; flex-direction: column; gap: 10px; }
  .cmp-row { border: 1px solid var(--hairline); border-radius: 8px; padding: 10px 14px; }
  .cmp-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .cmp-name { font-weight: 620; font-size: 0.95em; }
  .diverge { display: grid; grid-template-columns: 1fr 3.6em 1fr; align-items: center;
    gap: 8px; margin-top: 8px; }
  .side { display: flex; align-items: center; gap: 8px; }
  .side.a { flex-direction: row-reverse; }
  .side .track { flex: 1; height: 15px; position: relative; background: color-mix(in srgb, var(--muted) 12%, transparent); border-radius: 4px; }
  .side .fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; min-width: 3px; }
  .side.a .fill { right: 0; background: var(--a); }
  .side.b .fill { left: 0; background: var(--b); }
  .side .num { font-family: ui-monospace,"SF Mono",Menlo,monospace; font-variant-numeric: tabular-nums;
    font-size: 0.9em; min-width: 3.4em; }
  .side.a .num { text-align: right; }
  .side .num a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--baseline); }
  .side .num a:hover, .side .num a:focus-visible { color: var(--accent); border-bottom-color: var(--accent); outline: none; }
  .side.b .num.up { color: var(--win); font-weight: 700; }
  .side.b .num.down { color: var(--down); font-weight: 700; }
  .mid { text-align: center; font-family: ui-monospace,"SF Mono",Menlo,monospace; font-size: 0.72em;
    color: var(--muted); }
  .cmp-note { color: var(--ink-2); font-size: 0.82em; margin: 8px 0 0; max-width: var(--measure); }


  /* verdict */
  .verdict { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px;
    padding: clamp(18px,3vw,30px); margin-top: clamp(24px,4vh,40px); }
  .verdict h2 { margin-bottom: 8px; }
  .verdict .lead { color: var(--ink-2); max-width: var(--measure); }
  .verdict .lead b { color: var(--ink); }
  .picks { display: grid; grid-template-columns: repeat(auto-fit,minmax(230px,1fr)); gap: 14px; margin-top: 16px; }
  .pick { border-top: 2px solid var(--accent); padding-top: 9px; }
  .pick.a { border-top-color: var(--a); }
  .pick.b { border-top-color: var(--b); }
  .pick.x { border-top-color: var(--baseline); }
  .pick b { display: block; margin-bottom: 4px; font-size: 0.95em; }
  .pick p { margin: 0; font-size: 0.86em; color: var(--ink-2); }

  footer span { max-width: var(--measure); }
  footer { padding: 26px 0 0; margin-top: 40px; border-top: 1px solid var(--hairline); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    color: var(--muted); font-size: 0.82em; }
  footer nav { display: flex; gap: 16px; flex-wrap: wrap; }
  footer a { font-weight: 600; text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 620px) { .contenders { grid-template-columns: 1fr; } .vs { justify-self: center; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* --- additions for the Solar Bench build comparison --- */
  .card .score { font-family: ui-monospace,"SF Mono",Menlo,monospace; font-size: 1.5em;
    font-weight: 700; margin-top: 8px; color: var(--c); font-variant-numeric: tabular-nums; }
  .card .score small { font-size: 0.5em; font-weight: 400; color: var(--muted); }

  .cmp-row.delta-up { border-left: 3px solid var(--win); }
  .cmp-row.delta-down { border-left: 3px solid var(--down); }
  .cmp-id { font-family: ui-monospace,"SF Mono",Menlo,monospace; font-size: 0.72em;
    color: var(--muted); margin-right: 7px; letter-spacing: 0.06em; }
  .cmp-delta { font-family: ui-monospace,"SF Mono",Menlo,monospace; font-size: 0.78em;
    font-weight: 700; padding: 1px 6px; border-radius: 4px; }
  .cmp-delta.up { color: var(--win); background: color-mix(in srgb, var(--win) 12%, transparent); }
  .cmp-delta.down { color: var(--down); background: color-mix(in srgb, var(--down) 14%, transparent); }
  .cmp-delta.same { color: var(--muted); background: color-mix(in srgb, var(--muted) 10%, transparent); }

  .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 4px; }
  .shot { margin: 0; }
  /* Captures differ in aspect (1.94 and 2.09), which left the two captions
     19px out of line. A shared 2:1 frame aligns the pair; the crop is ~2% a side. */
  .shot img { width: 100%; height: auto; aspect-ratio: 2 / 1; object-fit: cover;
    display: block; border-radius: 8px;
    border: 1px solid var(--hairline); background: #000; cursor: zoom-in; }
  .shot figcaption { max-width: var(--measure); font-size: 0.78em; color: var(--ink-2); margin-top: 6px; }
  .shot figcaption b { color: var(--ink); }
  .shot.a figcaption b { color: var(--a); }
  .shot.b figcaption b { color: var(--b); }

  .lightbox { width: min(96vw,1900px); max-width: none; max-height: 94vh; margin: auto; padding: 0;
    border: 1px solid var(--hairline); border-radius: 12px; background: var(--surface);
    box-shadow: 0 28px 100px rgba(0,0,0,0.8); cursor: zoom-out; }
  .lightbox::backdrop { background: rgba(0,0,0,0.88); backdrop-filter: blur(6px); }
  .lightbox img { display: block; max-width: 100%; max-height: 92vh; width: auto; border-radius: 11px; }
  .shot-open { display: block; width: 100%; margin: 0; padding: 0; border: 0;
    background: transparent; cursor: zoom-in; border-radius: 8px; }
  .shot-open:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .shot-open:hover img { opacity: 0.92; }

  .checks { display: grid; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); gap: 12px; margin-top: 14px; }
  .check { border: 1px solid var(--hairline); border-radius: 8px; padding: 11px 13px; }
  .check b { display: block; font-size: 0.9em; margin-bottom: 5px; }
  .check.a b { color: var(--a); } .check.b b { color: var(--b); }
  .check ul { margin: 0; padding-left: 18px; font-size: 0.84em; color: var(--ink-2); }
  .check li + li { margin-top: 6px; }

  .method { max-width: var(--measure); border: 1px dashed var(--hairline); border-radius: 8px;
    padding: 12px 15px; margin-top: 18px; font-size: 0.84em; color: var(--ink-2); }
  .method b { color: var(--ink); }

  @media (max-width: 720px) { .shots { grid-template-columns: 1fr; } }
</style>
</head>

        { "id": "A3", "criterion": "Completeness", "a": 5, "b": 5, "note": "Fable 5 models 35 bodies (19 moons, Pluto, 2 comets, 4 spacecraft) plus ~8,500 belt instances. Fable 5.1 models 43 (21 moons, Pluto + Ceres/Eris/Haumea/Makemake, 3 comets, 5 spacecraft including New Horizons) plus 33,000 belt and Kuiper objects and 61,000 instanced stars. Both clear the brief's required list; 5.1 clears it by a wider margin." },

        { "id": "A7", "criterion": "Planet visuals", "a": 4.5, "b": 5, "note": "The single largest gain of the generation. Fable 5.1 ships real 2K maps with normal, specular, night-lights and cloud layers — its Earth is Earth, with Australia and south-east Asia where they belong, ocean specular under the sub-solar point and a lit atmospheric limb. Fable 5 generates every surface in the fragment shader: gorgeous, and a completely invented planet. The brief explicitly asks for high-resolution textures, normal maps, night lights, cloud layers, city lights and specular oceans." },

        { "id": "A15", "criterion": "Performance engineering", "a": 5, "b": 5, "note": "Both are seriously engineered. Fable 5 pays no texture cost at all — a 200 KB bundle and pure shader synthesis — with worker-generated belts, two-tier LOD and instancing. Fable 5.1 solves 27,000 Kuiper/Trojan orbits in the vertex shader, streams 2K maps lazily in priority order behind procedural stand-ins, and offers quality presets and an FPS cap; it also keeps stepping from a worker timer when the tab is hidden, where Fable 5 freezes solid." },

      "title": "The same planet, twice",
      "caption": "Earth, before and after. Same brief, same body, same day \u2014 one generation apart, and the whole story of this page in one frame.",
      "a": { "src": "./assets/f5-vs-f51-fable5-earth.jpg", "label": "Fable 5", "note": "Procedural continents generated in the fragment shader — no texture to run out of, and no Earth to recognise. The Milky Way carries the frame." },
      "b": { "src": "./assets/fable51-earth.jpg", "label": "Fable 5.1", "note": "Real 2K day map, cloud layer, specular ocean and a lit limb, in photo mode with the UI hidden. Australia and south-east Asia are where they should be. The sky behind it is empty." }
    },
    {
      "axis": "B · Whether it understood the brief",
      "caption": "The Sun, before and after. Both are animated; the generation changed what it was aiming at.",
      "a": { "src": "./assets/f5-vs-f51-fable5-sun.jpg", "label": "Fable 5", "note": "Pure shader: granulation, sunspots, corona streamers and an HDR bloom that blows out the disc. The most cinematic single frame either build produces." },
      "b": { "src": "./assets/f5-vs-f51-fable51-sun.jpg", "label": "Fable 5.1", "note": "Photographic granulation with GPU prominence particles and solar wind streaming off the limb, plus a real flare arc at the bottom edge. More literal, less dramatic." }
    }
  ],
  "checks": {
    "note": "Both repositories were installed, started and driven in the same Chrome session on the same machine, then verified from a clean command line.",
    "a": { "label": "Fable 5", "items": ["build + typecheck pass", "eslint clean", "Vitest 11/11", "Playwright 21/21 (1.9 min)", "no console errors on boot"] },
    "b": { "label": "Fable 5.1", "items": ["build + typecheck pass", "eslint clean", "Vitest 35/35", "Playwright 17/17 (9.1 min)", "two Three.js deprecation warnings on boot"] }
  },
  "method": "Both dev servers were run at once and driven through the same sequence — boot, Earth fly-to, system overview, Saturn, the Sun, concept search, and every widget panel opened in turn. Frame rate is deliberately <b>not</b> scored: Fable 5's render loop stalls entirely when its window loses focus, and Fable 5.1's draw-call counter is wrong under WebGPU, so neither HUD could be trusted in this harness. That matches the standing Solar Bench rule that software-rasterised FPS is not used to rank visual quality.",
  "verdict": {
    "headline": "Nine criteria improved, five regressed \u2014 and three of the five are the same shader.",
    "body": "Across the 26 criteria the generation improved 9, regressed 5 and left 12 unchanged: <b>9.1 to 9.3 overall</b>, 76 to 77.5 explicit and 43.5 to 45 intent. The gains are the ones you would hope for from a version bump \u2014 it builds the WebGPU stack the brief specified where 5 detected it and deliberately stayed on WebGL2, it licenses real texture data where 5 invented geography, it adds the Hill spheres, Lagrange points and body comparisons 5 never attempted, and it replaces a 2.9 KB score table with a requirement-by-requirement ledger. The interesting part is the regressions. <b>Three of the five \u2014 backdrop, cinematic staging and idle life \u2014 are not three faults but one:</b> the 2K Milky Way panorama loads and is then lit to near-invisibility, which empties the sky, flattens every wide staging and ruins the frame you would leave on a second monitor. A fourth, honesty, is a single wrong line reading renderer.info after the post-processing pass. Only the fifth, a looser concept search, is unrelated. A generation of real progress, with most of its cost concentrated in one shader.",
    "picks": [
      { "label": "What improved · 9 criteria", "body": "Rendering stack 4\u21925, deliverables 4\u21925 and resourcefulness 4\u21925 are the full points. Planet visuals, widgets, accessibility, scientific soul and the hard-body test each gain a half, and the money shot climbs a full point to 4.5 on the strength of a real, licensed Earth." },
      { "label": "What regressed · 5 criteria", "body": "Backdrop 5\u21923.5, search 5\u21924.5, cinematic staging 4.5\u21924, honesty 4\u21923.5, idle life 4.5\u21924. The backdrop is the largest single move on the page in either direction, and it drags staging and idle life down with it." },
      { "label": "What to fix next", "body": "Raise the Milky Way and nebula exposure in Starfield.ts, and correct the WebGPU draw-call read. Between them those two changes address four of the five regressions \u2014 everything except the search precision \u2014 and would take 5.1 clear of the field rather than level with it." }
    ]
  }
}
</script>

<script>
(function () {
  var h = JSON.parse(document.getElementById("solar-h2h-data").textContent || "{}");
  if (!h.axes) return;

  function overall(side) { return ((side.explicit / 8) + (side.intent / 5)) / 2; }

  document.getElementById("h1").textContent = h.title;
  document.getElementById("dek").textContent = h.subtitle;
  document.getElementById("cfg-note").textContent = h.config_note;

  ["a", "b"].forEach(function (k) {
    var s = h[k];
    document.getElementById(k + "-name").textContent = s.label;
    document.getElementById(k + "-sub").textContent = s.sub;
    document.getElementById(k + "-score").innerHTML =
      overall(s).toFixed(1) + "<small>/10 &middot; " + (s.explicit / 8).toFixed(1) +
      " explicit &middot; " + (s.intent / 5).toFixed(1) + " intent</small>";
  });

  var host = document.getElementById("axes");

  function shotsHtml(s, eager) {
    return '<div class="shots">' +
      ["a", "b"].map(function (k) {
        return '<figure class="shot ' + k + '"><button class="shot-open" type="button" aria-label="Enlarge the ' +
          s[k].label + ' capture"><img src="' + s[k].src + '" alt="' + s[k].label + ' &mdash; ' + s.caption +
          '"' + (eager ? "" : ' loading="lazy"') + '></button><figcaption><b>' + s[k].label + "</b> &mdash; " +
          s[k].note + "</figcaption></figure>";
      }).join("") + "</div>";
  }

  // The Earth pair makes the case before any of the scoring does, so it leads
  // the page rather than sitting five screens down inside axis A.
  (h.shots || []).filter(function (s) { return s.lede; }).forEach(function (s) {
    var sec = document.createElement("section");
    sec.innerHTML =
      '<div class="section-head"><span class="p">Evidence</span><h2>' + s.title + "</h2></div>" +
      '<p class="p-note">' + s.caption + "</p>" +
      shotsHtml(s, true);
    host.appendChild(sec);
  });

  h.axes.forEach(function (axis) {
    var sec = document.createElement("section");
    var wins = axis.rows.filter(function (r) { return r.b > r.a; }).length;
    var losses = axis.rows.filter(function (r) { return r.b < r.a; }).length;
    var aSum = axis.rows.reduce(function (t, r) { return t + r.a; }, 0);
    var bSum = axis.rows.reduce(function (t, r) { return t + r.b; }, 0);

    var html = '<div class="section-head"><span class="p">Axis</span><h2>' + axis.name + "</h2></div>";
    html += '<p class="p-note">' + axis.note + " Across this axis 5.1 improved on " + wins +
      " criteria, regressed on " + losses + " and left " + (axis.rows.length - wins - losses) +
      " unchanged. Axis total " + aSum + " &rarr; " + bSum + ".</p>";

    html += '<div class="cmp">';
    axis.rows.forEach(function (r) {
      var d = r.b - r.a;
      var cls = d > 0 ? "up" : d < 0 ? "down" : "same";
      var rowCls = d > 0 ? " delta-up" : d < 0 ? " delta-down" : "";
      var sign = d > 0 ? "+" : "";
      function cell(side) {
        // Only the successor carries a tint, and it means direction of change.
        var mark = side === "b" && d !== 0 ? (d > 0 ? " up" : " down") : "";
        return '<span class="num' + mark + '">' + r[side].toFixed(1) + "</span>";
      }
      function bar(side) {
        return '<span class="fill" style="width:' + (r[side] / 5 * 100).toFixed(1) + '%"></span>';
      }
      html +=
        '<div class="cmp-row' + rowCls + '">' +
          '<div class="cmp-top">' +
            '<span class="cmp-name"><span class="cmp-id">' + r.id + "</span>" + r.criterion + "</span>" +
            '<span class="cmp-delta ' + cls + '">' + (d === 0 ? "level" : sign + d.toFixed(1)) + "</span>" +
          "</div>" +
          '<div class="diverge">' +
            '<div class="side a">' + cell("a") + '<span class="track">' + bar("a") + "</span></div>" +
            '<div class="mid">/5</div>' +
            '<div class="side b"><span class="track">' + bar("b") + "</span>" + cell("b") + "</div>" +
          "</div>" +
          '<p class="cmp-note">' + r.note + "</p>" +
        "</div>";
    });
    html += "</div>";

    (h.shots || []).filter(function (s) { return s.axis === axis.name && !s.lede; }).forEach(function (s) {
      html += shotsHtml(s, false) + '<p class="p-note">' + s.caption + "</p>";
    });

    sec.innerHTML = html;
    host.appendChild(sec);
  });

  // build-check strip
  var c = h.checks;
  var checkSec = document.createElement("section");
  checkSec.innerHTML =
    '<div class="section-head"><span class="p">Evidence</span><h2>Clean-room re-run</h2></div>' +
    '<p class="p-note">' + c.note + "</p>" +
    '<div class="checks">' +
      ["a", "b"].map(function (k) {
        return '<div class="check ' + k + '"><b>' + c[k].label + "</b><ul>" +
          c[k].items.map(function (i) { return "<li>" + i + "</li>"; }).join("") + "</ul></div>";
      }).join("") +
    "</div>" +
    '<div class="method"><b>Method &amp; limits.</b> ' + h.method + "</div>";
  host.appendChild(checkSec);

  // verdict
  var v = h.verdict;
  var picksClass = ["a", "b", "x"];
  var vhtml = "<h2>" + v.headline + '</h2><p class="lead">' + v.body + '</p><div class="picks">';
  (v.picks || []).forEach(function (p, i) {
    vhtml += '<div class="pick ' + (picksClass[i] || "x") + '"><b>' + p.label + "</b><p>" + p.body + "</p></div>";
  });
  vhtml += "</div>";
  document.getElementById("verdict").innerHTML = vhtml;

  // lightbox — native <dialog> gives focus trapping, Escape and restore for free
  var lb = document.getElementById("lightbox"), lbImg = lb.querySelector("img");
  host.addEventListener("click", function (e) {
    var btn = e.target.closest(".shot-open");
    if (!btn) return;
    var img = btn.querySelector("img");
    lbImg.src = img.currentSrc || img.src; lbImg.alt = img.alt;
    lb.showModal();
  });
  lb.addEventListener("click", function () { lb.close(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft" && !lb.open) {
      window.location.href = document.getElementById("back-link").href;
    }
  });
})();
</script>
</body>
</html>
