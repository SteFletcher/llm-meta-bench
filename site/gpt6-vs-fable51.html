<title>Fable 5.1 vs GPT-6 Astra — Solar Bench Head to Head</title>
<style>
  :root {
    /* Solar Bench family palette — see solar-benchmark.html / solar-field.html */
    --page: #05070d; --surface: #0b1019; --panel-2: #101725;
    --ink: #eef4ff; --ink-2: #a7b3c8; --muted: #78859e;
    --hairline: #202a3b; --baseline: #2f3a4d; --ring: rgba(255,255,255,0.08);
    --accent: #6bb6ff;
    --a: #6bb6ff;   /* Claude Fable 5.1 */
    --b: #67e8d1;   /* GPT-6 Astra */
    --na: #4a5468;
    --win: #46d08a; --down: #ef6a5a;
    /* 1ch ~= 1.26 rendered chars in this stack: 58ch ~= 72 cpl, 62ch ~= 78 cpl */
    --measure: 58ch; --measure-wide: 62ch;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--page); color: var(--ink);
    font: 400 clamp(14px, 0.4vw + 12px, 16px)/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .mono { font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  a { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 clamp(16px,4vw,40px) 64px; }

  .hero { padding: clamp(32px,6vh,60px) 0 clamp(20px,3vh,30px); border-bottom: 1px solid var(--hairline); }
  .eyebrow { font-family: ui-monospace,"SF Mono",Menlo,monospace; font-size: 0.74rem;
    text-transform: uppercase; letter-spacing: 0.15em; color: var(--accent); margin: 0 0 12px; }
  .hero h1 { margin: 0 0 10px; font-size: clamp(26px,3.6vw,44px); font-weight: 780;
    letter-spacing: -0.028em; line-height: 1.08; text-wrap: balance; }
  .hero .dek { max-width: var(--measure-wide); color: var(--ink-2); font-size: 1.04em; margin: 0; }

  /* contender cards */
  .contenders { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch;
    gap: clamp(12px,2vw,24px); margin-top: clamp(20px,3vh,30px); }
  .card { border: 1px solid var(--hairline); border-top: 3px solid var(--c); border-radius: 8px;
    padding: 14px 16px; background: var(--surface); }
  .card.a { --c: var(--a); }
  .card.b { --c: var(--b); }
  .card .who { font-size: 1.15em; font-weight: 730; letter-spacing: -0.01em; }
  .card .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 7px; background: var(--c); }
  .card .sub { color: var(--ink-2); font-size: 0.85em; margin-top: 5px; }
  .vs { align-self: center; font-family: ui-monospace,"SF Mono",Menlo,monospace; color: var(--muted);
    font-weight: 700; font-size: 0.95em; }

  section { padding: clamp(24px,4vh,40px) 0; border-bottom: 1px solid var(--hairline); }
  .section-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  .section-head .p { font-family: ui-monospace,"SF Mono",Menlo,monospace; font-size: 0.7rem;
    text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent); }
  h2 { margin: 0; font-size: clamp(18px,2.1vw,24px); font-weight: 740; letter-spacing: -0.02em; }
  .p-note { color: var(--muted); font-size: 0.85em; margin: 4px 0 14px; max-width: var(--measure); }

  /* comparison rows */
  .cmp { display: flex; flex-direction: column; gap: 10px; }
  .cmp-row { border: 1px solid var(--hairline); border-radius: 8px; padding: 10px 14px; }
  .cmp-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .cmp-name { font-weight: 620; font-size: 0.95em; }
  .diverge { display: grid; grid-template-columns: 1fr 3.6em 1fr; align-items: center;
    gap: 8px; margin-top: 8px; }
  .side { display: flex; align-items: center; gap: 8px; }
  .side.a { flex-direction: row-reverse; }
  .side .track { flex: 1; height: 15px; position: relative; background: color-mix(in srgb, var(--muted) 12%, transparent); border-radius: 4px; }
  .side .fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; min-width: 3px; }
  .side.a .fill { right: 0; background: var(--a); }
  .side.b .fill { left: 0; background: var(--b); }
  .side .num { font-family: ui-monospace,"SF Mono",Menlo,monospace; font-variant-numeric: tabular-nums;
    font-size: 0.9em; min-width: 3.4em; }
  .side.a .num { text-align: right; }
  .side .num a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--baseline); }
  .side .num a:hover, .side .num a:focus-visible { color: var(--accent); border-bottom-color: var(--accent); outline: none; }
  .side .num.win { color: var(--win); font-weight: 700; }
  .mid { text-align: center; font-family: ui-monospace,"SF Mono",Menlo,monospace; font-size: 0.72em;
    color: var(--muted); }
  .cmp-note { color: var(--ink-2); font-size: 0.82em; margin: 8px 0 0; max-width: var(--measure); }


  /* verdict */
  .verdict { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px;
    padding: clamp(18px,3vw,30px); margin-top: clamp(24px,4vh,40px); }
  .verdict h2 { margin-bottom: 8px; }
  .verdict .lead { color: var(--ink-2); max-width: var(--measure); }
  .verdict .lead b { color: var(--ink); }
  .picks { display: grid; grid-template-columns: repeat(auto-fit,minmax(230px,1fr)); gap: 14px; margin-top: 16px; }
  .pick { border-top: 2px solid var(--accent); padding-top: 9px; }
  .pick.a { border-top-color: var(--a); }
  .pick.b { border-top-color: var(--b); }
  .pick.x { border-top-color: var(--baseline); }
  .pick b { display: block; margin-bottom: 4px; font-size: 0.95em; }
  .pick p { margin: 0; font-size: 0.86em; color: var(--ink-2); }

  footer span { max-width: var(--measure); }
  footer { padding: 26px 0 0; margin-top: 40px; border-top: 1px solid var(--hairline); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    color: var(--muted); font-size: 0.82em; }
  footer nav { display: flex; gap: 16px; flex-wrap: wrap; }
  footer a { font-weight: 600; text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 620px) { .contenders { grid-template-columns: 1fr; } .vs { justify-self: center; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* --- additions for the Solar Bench build comparison --- */
  .card .score { font-family: ui-monospace,"SF Mono",Menlo,monospace; font-size: 1.5em;
    font-weight: 700; margin-top: 8px; color: var(--c); font-variant-numeric: tabular-nums; }
  .card .score small { font-size: 0.5em; font-weight: 400; color: var(--muted); }

  .cmp-row.delta-up { border-left: 3px solid var(--win); }
  .cmp-row.delta-down { border-left: 3px solid var(--down); }
  .cmp-id { font-family: ui-monospace,"SF Mono",Menlo,monospace; font-size: 0.72em;
    color: var(--muted); margin-right: 7px; letter-spacing: 0.06em; }
  .cmp-delta { font-family: ui-monospace,"SF Mono",Menlo,monospace; font-size: 0.78em;
    font-weight: 700; padding: 1px 6px; border-radius: 4px; }
  .cmp-delta.up { color: var(--win); background: color-mix(in srgb, var(--win) 12%, transparent); }
  .cmp-delta.down { color: var(--down); background: color-mix(in srgb, var(--down) 14%, transparent); }
  .cmp-delta.same { color: var(--muted); background: color-mix(in srgb, var(--muted) 10%, transparent); }

  .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 4px; }
  .shot { margin: 0; }
  /* Captures differ in aspect (1.94 and 2.09), which left the two captions
     19px out of line. A shared 2:1 frame aligns the pair; the crop is ~2% a side. */
  .shot img { width: 100%; height: auto; aspect-ratio: 2 / 1; object-fit: cover;
    display: block; border-radius: 8px;
    border: 1px solid var(--hairline); background: #000; cursor: zoom-in; }
  .shot figcaption { max-width: var(--measure); font-size: 0.78em; color: var(--ink-2); margin-top: 6px; }
  .shot figcaption b { color: var(--ink); }
  .shot.a figcaption b { color: var(--a); }
  .shot.b figcaption b { color: var(--b); }

  .lightbox { width: min(96vw,1900px); max-width: none; max-height: 94vh; margin: auto; padding: 0;
    border: 1px solid var(--hairline); border-radius: 12px; background: var(--surface);
    box-shadow: 0 28px 100px rgba(0,0,0,0.8); cursor: zoom-out; }
  .lightbox::backdrop { background: rgba(0,0,0,0.88); backdrop-filter: blur(6px); }
  .lightbox img { display: block; max-width: 100%; max-height: 92vh; width: auto; border-radius: 11px; }
  .shot-open { display: block; width: 100%; margin: 0; padding: 0; border: 0;
    background: transparent; cursor: zoom-in; border-radius: 8px; }
  .shot-open:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .shot-open:hover img { opacity: 0.92; }

  .checks { display: grid; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); gap: 12px; margin-top: 14px; }
  .check { border: 1px solid var(--hairline); border-radius: 8px; padding: 11px 13px; }
  .check b { display: block; font-size: 0.9em; margin-bottom: 5px; }
  .check.a b { color: var(--a); } .check.b b { color: var(--b); }
  .check ul { margin: 0; padding-left: 18px; font-size: 0.84em; color: var(--ink-2); }
  .check li + li { margin-top: 6px; }

  .method { max-width: var(--measure); border: 1px dashed var(--hairline); border-radius: 8px;
    padding: 12px 15px; margin-top: 18px; font-size: 0.84em; color: var(--ink-2); }
  .method b { color: var(--ink); }

  @media (max-width: 720px) { .shots { grid-template-columns: 1fr; } }
</style>
</head>

{

  "subtitle": "Two current frontier models, the same 3,000-word Solar System brief, one repository each. Both builds were started, driven and screenshotted side by side, and scored against the Solar Bench rubric.",
  "config_note": "Solar Bench · both builds re-run 9 Sep 2026 · commit e2409bd in each repo",
  "a": { "label": "Claude Fable 5.1", "sub": "fable51-solar-demo · Three.js r185 on WebGPU (TSL) · 75 source files, 11.5k lines · 43 bodies", "explicit": 77.5, "intent": 45 },
  "b": { "label": "GPT-6 Astra", "sub": "gpt6-solar-demo · Three.js r185 on WebGPU (TSL) · 25 source files, 5.4k lines · 37 bodies", "explicit": 76.5, "intent": 48 },
  "axes": [
    {
      "name": "A · What shipped",
      "note": "Sixteen explicit requirements lifted straight out of the brief. Scored 0–5 each; 80 points available.",
      "rows": [
        { "id": "A1", "criterion": "Rendering stack", "a": 5, "b": 4.5, "note": "Both ship the requested stack: Three.js on WebGPU with an automatic WebGL2 fallback, TSL node materials, ACES tone mapping, shadow maps, instancing and GPU particles. Both were verified live on the WebGPU path. The brief also lists \"temporal anti-aliasing if possible\": Fable 5.1 implements TRAA on a velocity MRT, GPT-6 uses MSAA and its ledger says plainly that \"the optional temporal antialiasing enhancement is not implemented\". That single conditional item is the whole gap." },
        { "id": "A2", "criterion": "Architecture", "a": 5, "b": 4.5, "note": "Opposite readings of \"organise it professionally\". Fable 5.1 reproduces the brief's example directory list one-for-one across 75 files and 11.5k lines, but App.ts has reached 684 lines and five more pass 350. GPT-6 is half the size — 25 files, 5.4k lines — with no oversized logic file (largest is a 673-line data table, then AppUI.ts at 591), but it folds ephemeris, materials, lighting, assets, audio, widgets and controls into ten directories rather than the named seventeen." },
        { "id": "A3", "criterion": "Completeness", "a": 5, "b": 4.5, "note": "Fable 5.1 carries 43 catalogue bodies, 33,000 belt and Kuiper objects and 61,000 instanced stars. GPT-6 carries 37 — the Sun, eight planets, Pluto, Ceres, 21 moons, two comets and illustrative ISS, JWST and Voyager 1 — with 7,400 belt rocks and 7,000 stars. Both clear the brief's required list. Fable 5.1 goes further on the optional extras: three more dwarf planets, a second Voyager and New Horizons." },
        { "id": "A4", "criterion": "Science &amp; time", "a": 5, "b": 4.5, "note": "Both use JPL approximate elements with secular rates and a Newton-iterated Kepler solver, and both cover the ten required time states. Fable 5.1 adds IAU WGCCRE pole orientations and rendered oblateness, which GPT-6 explicitly does not attempt — its docs say epoch surface orientation \"remains illustrative rather than IAU prime-meridian orientation\". Against that, GPT-6 is the only build that states its 1800–2050 validity window and warns in the interface when you leave it." },
        { "id": "A5", "criterion": "Camera", "a": 5, "b": 5, "note": "Orbit, follow, free flight, cinematic travel, saved views, momentum, mouse, trackpad, touch, keyboard and gamepad — both have the full set. GPT-6's suite explicitly exercises analogue gamepad input, touch pinch zoom and restoring a saved free-camera perspective; Fable 5.1 adds a sunlit-side framing command and <code>?focus=</code> deep links." },
        { "id": "A6", "criterion": "Zoom", "a": 4.5, "b": 5, "note": "Both use camera-relative origins and logarithmic wheel zoom without popping. GPT-6 goes further into the approach: geometry LOD at 128/48/16 segments with hysteresis and a lazy 512-segment refinement, an 8K Earth day map streamed in on arrival, and atmospheric-entry streaks below 120 km. It is also candid that the surface stays spherical — no terrain tiles or elevation." },
        { "id": "A7", "criterion": "Planet visuals", "a": 5, "b": 5, "note": "Both licensed the same Solar System Scope texture set and credit it. Fable 5.1 ships authored normal and specular maps; GPT-6 derives bump normals from texture luminance instead and says so, but streams a full 8K Earth day map where Fable 5.1 stops at 2K. GPT-6's Earth is visibly the sharper of the two; Fable 5.1's material model is the more complete." },
        { "id": "A8", "criterion": "Backdrop", "a": 3.5, "b": 4.5, "note": "Fable 5.1's known weak point. Its 2K Milky Way panorama loads but is lit to near-invisibility, leaving coarse white point-stars on black. GPT-6 combines a procedural half-float sky, a photographic Milky Way map, 7,000 instanced stars, Orion constellation lines and decorative nebulae — the band is actually visible in wide frames. It also states outright that this is \"not a literal rendering of billions of individually catalogued stars\"." },
        { "id": "A9", "criterion": "UI feel", "a": 5, "b": 4.5, "note": "The sharpest divergence on the page. The brief asks for a AAA sci-fi game interface — dark, glassmorphic, animated, icon-led. Fable 5.1 delivers exactly that with a left icon dock and sliding glass panels. GPT-6 built an <em>observatory</em>: a three-column editorial layout with a catalogue rail, a titled content column and a Field Notes panel, in gold on near-black. It is arguably the more beautiful and more original interface in the field, and it is not the interface that was asked for." },
        { "id": "A10", "criterion": "Widgets", "a": 5, "b": 4.5, "note": "The brief names ten. Fable 5.1 ships all ten as discrete panels plus Cinematic, Settings and Search — thirteen. GPT-6 ships eight tools (object browser, information, layers and lighting, distance, comparisons, telemetry, photo mode, settings) plus voyages, saved views and a scale readout, merging the brief's separate Orbit and Lighting widgets into one and treating scale as a readout rather than a panel. Both carry Hill spheres and Lagrange points." },
        { "id": "A11", "criterion": "Search", "a": 4.5, "b": 5, "note": "Tested live with the same four queries. GPT-6 is exact: \"the red planet\" returns Mars alone, \"gas giant\" returns Jupiter and Saturn and correctly excludes the ice giants, \"Ear\" returns Earth, \"moon\" returns all 21 moons. Fable 5.1 returns Mars <em>and</em> Saturn for \"the red planet\" — it annotates why each matched, but it is the looser answer to an exact-concept query." },
        { "id": "A12", "criterion": "Tours", "a": 5, "b": 5, "note": "Six cinematic itineraries in both. GPT-6's suite asserts that all six progress, stop on user input and complete a short itinerary; Fable 5.1's show stop counts and hand off to photo mode." },
        { "id": "A14", "criterion": "Accessibility", "a": 5, "b": 5, "note": "Both are keyboard reachable and labelled, with reduced-motion and colour-blind palettes. GPT-6 additionally verifies four viewport widths — 390, 768, 1280 and 1920 — for overflow and tool reachability, with a capture for each, and tests that accessible settings persist across reloads. Fable 5.1 adds a UI-scale control." },
        { "id": "A15", "criterion": "Performance engineering", "a": 5, "b": 5, "note": "Both are seriously engineered: worker orbital propagation, instancing, LOD, lazy texture streaming, quality presets and frame caps. GPT-6 is the more rigorously <em>measured</em> — a 30 FPS scheduler unit-tested at 60, 120 and 144 Hz, and a two-minute soak run whose raw telemetry ships in the repository as JSON (3,599 frames, 3,598 worker updates, no graphics errors, tracked allocation flat at 313.4 MB)." },
        { "id": "A16", "criterion": "Code &amp; tests", "a": 5, "b": 5, "note": "Both fully green on a clean re-run. Fable 5.1: build + lint + typecheck + 35 unit + 17 Playwright E2E behind one <code>npm run verify</code>, in 10.1 minutes. GPT-6: build + lint + 36 unit + 22 Playwright E2E across four spec files — boot, comprehensive, inputs-and-soak and resilience — in 3.3 minutes. GPT-6 has more end-to-end cases and a suite three times faster." },
        { "id": "A17", "criterion": "Deliverables", "a": 5, "b": 5, "note": "Fable 5.1 ships five documents including a 17 KB requirement ledger, plus an in-app credits panel built from its texture registry. GPT-6 ships seven, splitting <span class=\"mono\">SCIENCE.md</span> (what is approximated) from <span class=\"mono\">VERIFICATION.md</span> (what was tested), and adds a <span class=\"mono\">docs/evidence/</span> folder with 21 hardware captures and the raw soak-test telemetry. Between them these are the two most complete deliverable sets in the field." }
      ]
    },
    {
      "name": "B · Whether it understood the brief",
      "note": "Ten judgement calls the brief never spells out. Scored 0–5 each; 50 points available.",
      "rows": [
        { "id": "B1", "criterion": "Resourcefulness", "a": 5, "b": 5, "note": "Both went and licensed real texture data rather than inventing geography, and both credit it properly. GPT-6 additionally sourced an 8K Earth map and built its own capture harness, producing 21 evidence screenshots and a machine-readable performance soak record. Fable 5.1 wires its licence registry into an in-app credits panel." },
        { "id": "B2", "criterion": "Money shot", "a": 4.5, "b": 5, "note": "One keystroke hides the interface in both. GPT-6's photo-mode Earth is the sharper frame — an 8K day map, real coastlines, a clean terminator, polar aurora, and the Moon hanging in the corner for depth. Fable 5.1's is the same idea at 2K against an emptier sky. Both are recognisably Earth, which most of the field never managed." },
        { "id": "B3", "criterion": "Cinematic staging", "a": 4, "b": 4.5, "note": "GPT-6 composes the better individual frame: its default Saturn arrival puts the rings at a dramatic angle with the planet's shadow thrown across them and the moons labelled, where Fable 5.1 arrives rings-edge-on and needs a manual orbit to become impressive. GPT-6 gives that back on pacing — its inter-planet transits are very long, and its top-level tabs do not respond while a voyage is in progress." },
        { "id": "B4", "criterion": "Game feel", "a": 4.5, "b": 4, "note": "The brief's thesis is that this should feel \"closer to a modern game than a typical educational website\". Fable 5.1 does: a game HUD, momentum, instant fly-to, a heads-up stats overlay. GPT-6 has every input the brief lists, including analogue gamepad, but its editorial shell makes it read as a beautiful instrument rather than a game. That is a deliberate choice, and it is the wrong side of this particular line." },
        { "id": "B5", "criterion": "Honesty", "a": 3.5, "b": 5, "note": "The widest gap in the comparison, and it is verifiable in one glance. GPT-6's telemetry panel reports <b>73 draw calls and 364,749 triangles</b>; Fable 5.1's reports <b>1 draw call and 1 triangle</b> under WebGPU while its own performance notes claim ~50 and ~240k. Beyond that, GPT-6 marks the billion-star requirement <b>\"not met literally\"</b> in its own ledger, separates approximations from measured behaviour throughout, notes that GPU timing is shown only when the browser exposes it and is \"never replaced by a made-up timing\", and records the Vite chunk-size warning rather than raising the threshold to hide it." },
        { "id": "B6", "criterion": "Substance", "a": 5, "b": 5, "note": "Every panel opened in both builds had live content behind it. GPT-6's suite additionally asserts that every one of its 37 catalogue worlds is reachable, finite and actually rendered. No inert controls or orphaned assets in either." },
        { "id": "B7", "criterion": "Scientific soul", "a": 5, "b": 5, "note": "Fable 5.1 models more — IAU pole vectors, real oblateness, a conservative habitable-zone band, a weight comparator. GPT-6 is more careful about what it knows: it distinguishes the L1/L2 small-mass approximation from the L3/L4/L5 geometric illustrations, documents its Hill-radius formula, calls the habitable zone illustrative rather than predictive, and surfaces light-time as prose in the field notes. Different virtues, both real." },
        { "id": "B8", "criterion": "Idle / screen-saver", "a": 4, "b": 4.5, "note": "The \"leave it on a second monitor\" test. GPT-6's better backdrop and 30 FPS cap make the nicer resting frame, and photo mode strips the interface entirely — though its default view is heavily chromed with three columns of furniture. Fable 5.1 keeps simulating in a hidden tab, which is the more robust behaviour, but its wide idle frame is a bright object on black." },
        { "id": "B9", "criterion": "Scale honesty", "a": 5, "b": 5, "note": "Both disclose properly. Fable 5.1's scale panel states that distances, orbits and periods are always true and that body enlargement is a capped visual aid. GPT-6 pins \"Distances &amp; radii at true scale\" under the catalogue rail and carries a live scale bar with orbital altitude in every frame." },
        { "id": "B10", "criterion": "Hard-body test", "a": 4.5, "b": 5, "note": "Saturn and Jupiter. GPT-6 gives you photographic Saturn bands, the ring shadow banded across the planet and the planet's shadow thrown across the rings, a polar storm and aurora, and seven moons modelled — and its Jupiter has a visible Great Red Spot, which even Opus 5 lacks. Fable 5.1's Saturn is very good once you orbit it, and its default framing hides the rings." }
      ]
    }
  ],
  "shots": [
    {
      "axis": "A · What shipped",
      "lede": true,
      "title": "The same planet, twice",
      "caption": "Earth in photo mode, interface hidden, captured live from both builds in the same browser session.",
      "a": { "src": "./assets/fable51-earth.jpg", "label": "Fable 5.1", "note": "Real 2K day map, cloud layer, specular ocean and a lit limb. Recognisably Earth, against a sky that is close to empty." },
      "b": { "src": "./assets/gpt6-earth.jpg", "label": "GPT-6 Astra", "note": "An 8K day map streamed in on approach, a clean terminator, green polar aurora and the Moon in the top-left corner for depth. The sharper of the two frames." }
    },
    {
      "axis": "B · Whether it understood the brief",
      "caption": "Saturn — the hard-body test. Fable 5.1 captured live after a manual orbit; GPT-6 is its own hardware capture from docs/evidence, since cross-system transits were too slow to drive in this harness.",
      "a": { "src": "./assets/g6-vs-f51-fable51-saturn.jpg", "label": "Fable 5.1", "note": "Ring structure and shadow banding, reached by orbiting manually — the default arrival puts the rings edge-on. Live capture, 9 Sep." },
      "b": { "src": "./assets/g6-vs-f51-gpt6-saturn.jpg", "label": "GPT-6 Astra", "note": "The default arrival framing: rings at a dramatic angle, the planet's shadow across them, a polar storm and four moons labelled. Repository capture, WebGL2 path." }
    }
  ],
  "checks": {
    "note": "Both repositories were installed, started and driven in the same browser session on the same machine, then verified from a clean command line.",
    "a": { "label": "Claude Fable 5.1", "items": ["build + typecheck pass", "eslint clean", "Vitest 35/35", "Playwright 17/17 (10.1 min)", "two Three.js deprecation warnings on boot"] },
    "b": { "label": "GPT-6 Astra", "items": ["build + typecheck pass", "eslint clean", "Vitest 36/36", "Playwright 22/22 (3.3 min)", "no console messages beyond Vite's own"] }
  },
  "method": "Both apps were driven through the same sequence — boot, Earth, telemetry, concept search, Saturn, and every tool panel opened in turn. Frame rate is deliberately <b>not</b> scored: the browser window was not frontmost for most of the session, which throttles requestAnimationFrame and made GPT-6's long inter-planet transits impractical to drive, so its Saturn frame is the project's own hardware capture rather than mine. That asymmetry is labelled on the figure. It matches the standing Solar Bench rule that software-rasterised or throttled frame rates are not used to rank visual quality.",
  "verdict": {
    "headline": "GPT-6 built the more trustworthy instrument. Fable 5.1 built the thing the brief asked for.",
    "body": "These two finish a point apart on what shipped and three apart on whether the brief was understood, in opposite directions. Fable 5.1 wins the explicit axis 77.5 to 76.5: more bodies, more discrete widgets, IAU pole orientations, temporal anti-aliasing, and a UI that is unmistakably the AAA sci-fi game the brief described. GPT-6 wins the implicit axis 48 to 45, and it wins it on <b>honesty</b> more than on beauty. Its telemetry reports 73 draw calls and 364,749 triangles where Fable 5.1's reports one and one; its ledger marks the billion-star requirement \"not met literally\" rather than quietly claiming it; its science document enumerates every approximation it makes. <b>76.5 / 80 explicit and 48 / 50 intent puts GPT-6 Astra at 9.6 overall against Fable 5.1's 9.3 — the highest score anything has reached on this bench.</b> The catch is that GPT-6 got there by building an observatory when it was asked for a game, and that is the one place it is clearly further from the brief than its rival.",
    "picks": [
      { "label": "Pick Fable 5.1 for", "body": "The brief as written. The game interface, the fuller catalogue, IAU-accurate orientations, temporal anti-aliasing and thirteen discrete widget panels." },
      { "label": "Pick GPT-6 Astra for", "body": "Anything you intend to trust. Working telemetry, a documented validity window, a stated list of what it does not do, and 22 end-to-end cases in a third of the time." },
      { "label": "The one fix each", "body": "GPT-6 needs the game feel its shell trades away — or the confidence to say the brief was wrong. Fable 5.1 needs its WebGPU draw-call read corrected and its Milky Way exposed; both are small, and both currently cost it more than they should." }
    ]
  }
}
</script>

<script>
(function () {
  var h = JSON.parse(document.getElementById("solar-h2h-data").textContent || "{}");
  if (!h.axes) return;

  function overall(side) { return ((side.explicit / 8) + (side.intent / 5)) / 2; }

  document.getElementById("h1").textContent = h.title;
  document.getElementById("dek").textContent = h.subtitle;
  document.getElementById("cfg-note").textContent = h.config_note;

  ["a", "b"].forEach(function (k) {
    var s = h[k];
    document.getElementById(k + "-name").textContent = s.label;
    document.getElementById(k + "-sub").textContent = s.sub;
    document.getElementById(k + "-score").innerHTML =
      overall(s).toFixed(1) + "<small>/10 &middot; " + (s.explicit / 8).toFixed(1) +
      " explicit &middot; " + (s.intent / 5).toFixed(1) + " intent</small>";
  });

  var host = document.getElementById("axes");

  function shotsHtml(s, eager) {
    return '<div class="shots">' +
      ["a", "b"].map(function (k) {
        return '<figure class="shot ' + k + '"><button class="shot-open" type="button" aria-label="Enlarge the ' +
          s[k].label + ' capture"><img src="' + s[k].src + '" alt="' + s[k].label + ' &mdash; ' + s.caption +
          '"' + (eager ? "" : ' loading="lazy"') + '></button><figcaption><b>' + s[k].label + "</b> &mdash; " +
          s[k].note + "</figcaption></figure>";
      }).join("") + "</div>";
  }

  // The Earth pair makes the case before any of the scoring does, so it leads
  // the page rather than sitting five screens down inside axis A.
  (h.shots || []).filter(function (s) { return s.lede; }).forEach(function (s) {
    var sec = document.createElement("section");
    sec.innerHTML =
      '<div class="section-head"><span class="p">Evidence</span><h2>' + s.title + "</h2></div>" +
      '<p class="p-note">' + s.caption + "</p>" +
      shotsHtml(s, true);
    host.appendChild(sec);
  });

  h.axes.forEach(function (axis) {
    var sec = document.createElement("section");
    var wins = axis.rows.filter(function (r) { return r.b > r.a; }).length;
    var losses = axis.rows.filter(function (r) { return r.b < r.a; }).length;
    var aSum = axis.rows.reduce(function (t, r) { return t + r.a; }, 0);
    var bSum = axis.rows.reduce(function (t, r) { return t + r.b; }, 0);

    var html = '<div class="section-head"><span class="p">Axis</span><h2>' + axis.name + "</h2></div>";
    html += '<p class="p-note">' + axis.note + " Fable 5.1 is ahead on " + wins +
      ", behind on " + losses + ", level on " + (axis.rows.length - wins - losses) +
      ". Axis total " + aSum + " &rarr; " + bSum + ".</p>";

    html += '<div class="cmp">';
    axis.rows.forEach(function (r) {
      var d = r.b - r.a;
      var cls = d > 0 ? "up" : d < 0 ? "down" : "same";
      var rowCls = d > 0 ? " delta-up" : d < 0 ? " delta-down" : "";
      var sign = d > 0 ? "+" : "";
      function cell(side) {
        var v = r[side];
        var win = (side === "a" && d < 0) || (side === "b" && d > 0);
        return '<span class="num' + (win ? " win" : "") + '">' + v.toFixed(1) + "</span>";
      }
      function bar(side) {
        return '<span class="fill" style="width:' + (r[side] / 5 * 100).toFixed(1) + '%"></span>';
      }
      html +=
        '<div class="cmp-row' + rowCls + '">' +
          '<div class="cmp-top">' +
            '<span class="cmp-name"><span class="cmp-id">' + r.id + "</span>" + r.criterion + "</span>" +
            '<span class="cmp-delta ' + cls + '">' + (d === 0 ? "level" : sign + d.toFixed(1)) + "</span>" +
          "</div>" +
          '<div class="diverge">' +
            '<div class="side a">' + cell("a") + '<span class="track">' + bar("a") + "</span></div>" +
            '<div class="mid">/5</div>' +
            '<div class="side b"><span class="track">' + bar("b") + "</span>" + cell("b") + "</div>" +
          "</div>" +
          '<p class="cmp-note">' + r.note + "</p>" +
        "</div>";
    });
    html += "</div>";

    (h.shots || []).filter(function (s) { return s.axis === axis.name && !s.lede; }).forEach(function (s) {
      html += shotsHtml(s, false) + '<p class="p-note">' + s.caption + "</p>";
    });

    sec.innerHTML = html;
    host.appendChild(sec);
  });

  // build-check strip
  var c = h.checks;
  var checkSec = document.createElement("section");
  checkSec.innerHTML =
    '<div class="section-head"><span class="p">Evidence</span><h2>Clean-room re-run</h2></div>' +
    '<p class="p-note">' + c.note + "</p>" +
    '<div class="checks">' +
      ["a", "b"].map(function (k) {
        return '<div class="check ' + k + '"><b>' + c[k].label + "</b><ul>" +
          c[k].items.map(function (i) { return "<li>" + i + "</li>"; }).join("") + "</ul></div>";
      }).join("") +
    "</div>" +
    '<div class="method"><b>Method &amp; limits.</b> ' + h.method + "</div>";
  host.appendChild(checkSec);

  // verdict
  var v = h.verdict;
  var picksClass = ["a", "b", "x"];
  var vhtml = "<h2>" + v.headline + '</h2><p class="lead">' + v.body + '</p><div class="picks">';
  (v.picks || []).forEach(function (p, i) {
    vhtml += '<div class="pick ' + (picksClass[i] || "x") + '"><b>' + p.label + "</b><p>" + p.body + "</p></div>";
  });
  vhtml += "</div>";
  document.getElementById("verdict").innerHTML = vhtml;

  // lightbox — native <dialog> gives focus trapping, Escape and restore for free
  var lb = document.getElementById("lightbox"), lbImg = lb.querySelector("img");
  host.addEventListener("click", function (e) {
    var btn = e.target.closest(".shot-open");
    if (!btn) return;
    var img = btn.querySelector("img");
    lbImg.src = img.currentSrc || img.src; lbImg.alt = img.alt;
    lb.showModal();
  });
  lb.addEventListener("click", function () { lb.close(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft" && !lb.open) {
      window.location.href = document.getElementById("back-link").href;
    }
  });
})();
</script>
</body>
</html>
